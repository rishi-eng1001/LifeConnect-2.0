<!DOCTYPE html>
<html>

<head>
    <title>Results</title>
</head>

<body>
    <h1>{{ count }} Donors found for {{ blood }}</h1>
    {% for d in donors %}
    <div style="border:1px solid #ddd;padding:10px;margin:10px 0">
        <b>{{ d['name'] }}</b> - {{ d['blood_group'] }} - {{ d['city'] }}<br>
        Phone: <a href="tel:{{ d['phone'] }}">{{ d['phone'] }}</a> |
        <a href="https://wa.me/91{{ d['phone'] }}">WhatsApp</a>
    </div>
    {% else %}
    <p>No donor found. <a href="/register">Register as Donor</a></p>
    {% endfor %}
    <a href="/">Back to Search</a>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKTH SETU | Pan-India Blood Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #d32f2f;
            --bg: #f8fafc
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif
        }

        body {
            background: var(--bg)
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px
        }

        nav {
            background: white;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 999;
            padding: 15px 0
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--red)
        }

        .hero {
            padding: 60px 0;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px
        }

        .hero h1 {
            font-size: 48px
        }

        .hero h1 span {
            color: var(--red)
        }

        .search-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(211, 47, 47, 0.15)
        }

        .btn {
            padding: 14px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            width: 100%
        }

        .btn-red {
            background: var(--red);
            color: white;
            margin-top: 15px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 50px 0
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center
        }

        .stat-card h2 {
            font-size: 32px;
            color: var(--red)
        }

        .request-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid var(--red);
            margin: 15px 0;
            display: flex;
            justify-content: space-between
        }

        label {
            font-size: 12px;
            font-weight: 600
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 5px
        }
    </style>
</head>

<body>

    <nav>
        <div class="container">
            <div class="logo">🩸 RAKTH SETU</div>
        </div>
    </nav>

    <section class="container hero">
        <div>
            <h1>The bridge between <span>donors and lives</span> saved</h1>
            <p style="margin:20px 0;color:#555">Connect 50,000+ donors across 800+ cities in 60 seconds.</p>
        </div>
        <div class="search-card">
            <h3>🩸 Find Blood</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px">
                <div><label>BLOOD GROUP</label><select id="blood"></select></div>
                <div><label>STATE</label><select id="state" onchange="loadCities()"></select></div>
                <div><label>CITY</label><select id="city"></select></div>
                <div><label>COMPONENT</label><select>
                        <option>Whole Blood</option>
                    </select></div>
            </div>
            <button class="btn btn-red" onclick="search()">🔍 Search Blood Availability</button>
        </div>
    </section>

    <section class="container stats">
        <div class="stat-card">
            <h2>50,000+</h2>
            <p>Registered Donors</p>
        </div>
        <div class="stat-card">
            <h2>5000+</h2>
            <p>Partner Hospitals</p>
        </div>
        <div class="stat-card">
            <h2>18,500+</h2>
            <p>Units Available</p>
        </div>
        <div class="stat-card">
            <h2>42,000+</h2>
            <p>Certificates Issued</p>
        </div>
    </section>

    <section class="container" id="results"></section>

    <script>
        // 1. ALL 28 STATES + MAJOR CITIES
        const states = {
            "All States": ["All Cities"], "Andhra Pradesh": ["Visakhapatnam", "Vijayawada", "Guntur"], "Arunachal Pradesh": ["Itanagar"], "Assam": ["Guwahati", "Dibrugarh"],
            "Bihar": ["Patna", "Gaya", "Muzaffarpur", "Bhagalpur", "Darbhanga"], "Chhattisgarh": ["Raipur", "Bhilai"], "Delhi": ["New Delhi", "Dwarka", "Rohini", "Saket"],
            "Goa": ["Panaji", "Vasco"], "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot"], "Haryana": ["Gurgaon", "Faridabad", "Panipat"],
            "Himachal Pradesh": ["Shimla", "Mandi"], "Jharkhand": ["Ranchi", "Jamshedpur"], "Karnataka": ["Bangalore", "Mysore", "Hubli", "Mangalore"],
            "Kerala": ["Kochi", "Trivandrum", "Kozhikode"], "Madhya Pradesh": ["Bhopal", "Indore", "Jabalpur"], "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Nashik"],
            "Manipur": ["Imphal"], "Meghalaya": ["Shillong"], "Mizoram": ["Aizawl"], "Nagaland": ["Kohima"], "Odisha": ["Bhubaneswar", "Cuttack"],
            "Punjab": ["Chandigarh", "Ludhiana", "Amritsar"], "Rajasthan": ["Jaipur", "Jodhpur", "Udaipur"], "Sikkim": ["Gangtok"],
            "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai"], "Telangana": ["Hyderabad", "Warangal"], "Tripura": ["Agartala"],
            "Uttar Pradesh": ["Lucknow", "Kanpur", "Noida", "Gonda", "Varanasi", "Agra", "Prayagraj"], "Uttarakhand": ["Dehradun", "Haridwar"],
            "West Bengal": ["Kolkata", "Siliguri", "Durgapur"]
        };

        // Load dropdowns
        const bloodGroups = ["Any Group", "A+", "B+", "O+", "AB+", "A-", "B-", "O-", "AB-"];
        bloodGroups.forEach(b => document.getElementById('blood').innerHTML += `<option>${b}</option>`);
        for (let s in states) document.getElementById('state').innerHTML += `<option>${s}</option>`;

        function loadCities() {
            let s = document.getElementById('state').value;
            let c = document.getElementById('city');
            c.innerHTML = '';
            states[s].forEach(x => c.innerHTML += `<option>${x}</option>`)
        }
        loadCities();

        // 2. GENERATE 10,000 DONORS FOR ALL STATES
        let donors = [];
        const names = ["Aman", "Priya", "Rahul", "Sneha", "Vikram", "Anjali", "Rohit", "Kavita", "Arjun", "Pooja", "Sonia", "Deepak", "Neha", "Amit"];
        for (let i = 0; i < 10000; i++) {
            let stateKeys = Object.keys(states).filter(k => k != "All States");
            let randomState = stateKeys[i % stateKeys.length];
            let randomCity = states[randomState][i % states[randomState].length];
            donors.push({
                name: `${names[i % 14]} ${i}`,
                blood: bloodGroups[(i % 8) + 1], // Skip "Any Group"
                city: randomCity,
                state: randomState,
                phone: `9198${Math.floor(Math.random() * 90000000 + 10000000)}`,
                verified: i % 4 == 0,
                distance: Math.floor(Math.random() * 50) + 1
            })
        }

        // 3. SEARCH FUNCTION - 100% WORKING
        function search() {
            let b = document.getElementById('blood').value;
            let city = document.getElementById('city').value;
            let state = document.getElementById('state').value;

            let filtered = donors.filter(d => {
                let bloodMatch = (b == "Any Group" || d.blood == b);
                let cityMatch = (city == "All Cities" || d.city == city);
                let stateMatch = (state == "All States" || d.state == state);
                return bloodMatch && cityMatch && stateMatch;
            }).slice(0, 20); // Show max 20 results

            if (filtered.length == 0) {
                document.getElementById('results').innerHTML = `<div class="request-card"><h3>😔 No donors found. Try "Any Group" or "All Cities"</h3></div>`;
                return;
            }

            let html = `<h2 style="margin:30px 0">Found ${filtered.length} Donors</h2>`;
            filtered.forEach(d => {
                html += `
    <div class="request-card">
      <div><b>${d.name}</b> ${d.verified ? '<span style="background:#e8f5e9;color:#2e7d32;padding:3px 8px;border-radius:20px;font-size:12px">Verified</span>' : ''}<br>
      Blood: <b style="color:var(--red)">${d.blood}</b> | 📍 ${d.city}, ${d.state} | ${d.distance}km away</div>
      <button class="btn btn-red" style="width:auto" onclick="window.open('https://wa.me/${d.phone}?text=Urgent ${d.blood} blood needed in ${d.city}')">💬 WhatsApp</button>
    </div>`;
            });
            document.getElementById('results').innerHTML = html;
        }
    </script>
</body>

</html>

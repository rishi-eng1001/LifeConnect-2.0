<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LifeConnect 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff4b5c 0%, #8B0000 100%);
            min-height: 100vh;
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: 52px;
            font-weight: 800;
        }

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            color: #8B0000;
            padding: 40px;
            border-radius: 20px;
            width: 320px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            text-align: left;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .btn {
            background: #c31432;
            color: white;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .donor-item {
            background: #f8f8f8;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Save Lives.</h1>
        <p>Connecting <span id="donorCount">500</span>+ Donors with 23+ Hospitals in Real-Time</p>

        <div class="cards">
            <div class="card" onclick="openModal('find')">
                <h2>❤️ FIND DONOR</h2>
                <p>Search by Blood Group & City</p>
            </div>
            <div class="card" onclick="openModal('stock')">
                <h2>🏥 CHECK STOCK</h2>
                <p>Live Blood Unit availability</p>
            </div>
            <div class="card" onclick="openModal('register')">
                <h2>➕ REGISTER DONOR</h2>
                <p>Become a life saver today</p>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        // DUMMY DATA
        let donors = [
            { name: "Rahul Verma", blood: "B+", city: "Lucknow", phone: "9876543210" },
            { name: "Priya Singh", blood: "O+", city: "Lucknow", phone: "9876543211" },
            { name: "Aman Gupta", blood: "A+", city: "Kanpur", phone: "9876543212" }
        ];
        let stock = [
            { hospital: "SGPGI Lucknow", "A+": 12, "B+": 8, "O+": 15 },
            { hospital: "KGMU Lucknow", "A+": 5, "B+": 20, "O+": 10 }
        ];

        function openModal(type) {
            let body = document.getElementById('modalBody');
            if (type == 'find') {
                body.innerHTML = `<h2>Find Donor</h2>
    <select id="blood"><option>B+</option><option>O+</option><option>A+</option></select>
    <input id="city" placeholder="Enter City">
    <button class="btn" onclick="searchDonor()">Search</button>
    <div id="result"></div>`;
            }
            if (type == 'stock') {
                let html = `<h2>Hospital Stock</h2>`;
                stock.forEach(h => {
                    html += `<div class="donor-item"><b>${h.hospital}</b><br>A+: ${h["A+"]} | B+: ${h["B+"]} | O+: ${h["O+"]}</div>`
                });
                body.innerHTML = html + `<button class="btn" onclick="closeModal()">Close</button>`;
            }
            if (type == 'register') {
                body.innerHTML = `<h2>Register Donor</h2>
    <input id="rname" placeholder="Full Name">
    <select id="rblood"><option>B+</option><option>O+</option><option>A+</option></select>
    <input id="rcity" placeholder="City">
    <input id="rphone" placeholder="Phone">
    <button class="btn" onclick="registerDonor()">Register</button>`;
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function searchDonor() {
            let b = document.getElementById('blood').value;
            let c = document.getElementById('city').value;
            let res = donors.filter(d => d.blood == b && d.city.toLowerCase().includes(c.toLowerCase()));
            let html = res.length ? res.map(d => `<div class="donor-item">${d.name} - ${d.phone}</div>`).join('') : "No donor found";
            document.getElementById('result').innerHTML = html;
        }

        function registerDonor() {
            donors.push({
                name: document.getElementById('rname').value,
                blood: document.getElementById('rblood').value,
                city: document.getElementById('rcity').value,
                phone: document.getElementById('rphone').value
            });
            document.getElementById('donorCount').innerText = 500 + donors.length - 3;
            alert("Donor Registered Successfully!");
            closeModal();
        }

        // Modal ke bahar click karne pe band ho
        window.onclick = (e) => { if (e.target.id == 'modal') closeModal() }
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Register Donor</title>
</head>

<body>
    <h1>Become a Blood Donor</h1>
    <form method="POST">
        <input name="name" placeholder="Full Name" required><br>
        <select name="blood_group" required>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select><br>
        <input name="city" placeholder="City" required><br>
        <input name="phone" placeholder="10 digit Phone" required><br>
        <button type="submit">Register Now</button>
    </form>
</body>

</html>
